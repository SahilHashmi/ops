<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">OpsXpress network operations center</title>
  <desc id="description">An original illustration of an OpsXpress engineer monitoring infrastructure dashboards and global alerts.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f9"/>
      <stop offset="0.55" stop-color="#e9ebed"/>
      <stop offset="1" stop-color="#cfd3d6"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0.8" y2="1">
